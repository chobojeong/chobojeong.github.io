name: Deploy GitHub Pages with Kakao Key

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Kakao JavaScript Key
        env:
          KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
        run: |
          if [ -z "$KAKAO_JS_KEY" ]; then
            echo "Error: KAKAO_JS_KEY secret is empty."
            exit 1
          fi
          sed -i "s|__KAKAO_JS_KEY__|${KAKAO_JS_KEY}|g" *.html

      - name: Prepare site folder
        run: |
          mkdir -p _site
          cp *.html _site/
          if [ -f seoul_wifi.csv ]; then cp seoul_wifi.csv _site/; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
